# Render Blueprint (render.yaml)
# Learn more: https://render.com/docs/blueprint-spec

services:
  # -------------------------------------------------------------
  # 1. Backend Web Service (Express API)
  # -------------------------------------------------------------
  - type: web
    name: vidyapath-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      # Set your MongoDB Atlas connection string in Render Dashboard
      - key: MONGO_URI
        sync: false
      # Automatically generate a secure JWT secret if not provided
      - key: JWT_SECRET
        generateValue: true
      # Link to frontend URL for CORS
      - key: FRONTEND_URL
        fromService:
          type: web
          name: vidyapath-frontend
          property: url

  # -------------------------------------------------------------
  # 2. Frontend Static Site (React App)
  # -------------------------------------------------------------
  - type: web
    name: vidyapath-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./build
    autoDeploy: true
    envVars:
      - key: REACT_APP_API_URL
        fromService:
          type: web
          name: vidyapath-backend
          property: url
          append: /api
    routes:
      # React Single Page App routing rule (redirect all paths to index.html)
      - type: rewrite
        source: /*
        destination: /index.html
